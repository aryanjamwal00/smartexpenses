services:
  - type: web
    name: smartexpense
    runtime: docker
    plan: free
    envVars:
      - key: PORT
        value: 8080
      - key: H2_CONSOLE_ENABLED
        value: false
      - key: WEBHOOK_SECRET
        generateValue: true
    # Link the PostgreSQL database to this service
    databases:
      - smartexpense-db

databases:
  - name: smartexpense-db
    databaseName: smartexpense
    user: smartexpense
    plan: free
