services:
  - type: web
    name: smartexpense
    runtime: docker
    plan: free
    envVars:
      - key: PORT
        value: "8080"
      - key: H2_CONSOLE_ENABLED
        value: "false"
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: SPRING_JPA_DATABASE_PLATFORM
        value: org.hibernate.dialect.PostgreSQLDialect
      - key: SPRING_DATASOURCE_DRIVER_CLASS_NAME
        value: org.postgresql.Driver
      - key: DATABASE_URL
        fromDatabase:
          name: smartexpense-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: smartexpense-db
    databaseName: smartexpense
    user: smartexpense
    plan: free
