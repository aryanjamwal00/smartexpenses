version: '3.8'

services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgresql://smartexpense:smartexpense@postgres:5432/smartexpense
      - SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.PostgreSQLDialect
    depends_on:
      - postgres
    networks:
      - smartexpense-network

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=smartexpense
      - POSTGRES_USER=smartexpense
      - POSTGRES_PASSWORD=smartexpense
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - smartexpense-network

volumes:
  postgres-data:

networks:
  smartexpense-network:
    driver: bridge
