spring.application.name=smartexpense

# Database Configuration
# Spring Boot auto-configures from DATABASE_URL environment variable (Render provides this)
# For local development without DATABASE_URL, use H2 file-based database (persistent)
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/expensedb;MODE=PostgreSQL}
spring.datasource.driverClassName=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}

# Enable H2 Web Console to view database tables in browser (http://localhost:8080/h2-console)
# Disabled in production for security
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Server Configuration
server.port=${PORT:8080}
