spring.application.name=smartexpense

# Database Configuration
# Production: Uses PostgreSQL via DATABASE_URL from Render
# Local: Falls back to H2 file-based database for development
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/expensedb;MODE=PostgreSQL}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# Spring Boot auto-detects driver class from the JDBC URL
# If DATABASE_URL starts with postgresql:, it uses PostgreSQL driver
# If DATABASE_URL starts with jdbc:h2:, it uses H2 driver

# Database dialect - set by render.yaml in production, defaults to H2 locally
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Enable H2 Web Console to view database tables in browser (http://localhost:8080/h2-console)
# Disabled in production for security
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Server Configuration
server.port=${PORT:8080}
