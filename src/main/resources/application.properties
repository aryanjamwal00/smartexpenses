spring.application.name=smartexpense

# Database Configuration - Supports both PostgreSQL (production) and H2 (local)
# Set DATABASE_URL environment variable to use PostgreSQL in production
# Example: postgresql://user:password@host:5432/dbname

# H2 In-Memory Database (default for local development)
spring.datasource.url=jdbc:h2:mem:expensedb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Enable H2 Web Console to view database tables in browser (http://localhost:8080/h2-console)
spring.h2.console.enabled=true

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Server Configuration
server.port=${PORT:8080}
