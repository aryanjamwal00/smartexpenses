spring.application.name=smartexpense

# Database Configuration
# Production: Uses PostgreSQL via DATABASE_URL from Render (auto-detected)
# Local: Falls back to H2 file-based database for development
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/expensedb;MODE=PostgreSQL}
spring.datasource.driverClassName=${DB_DRIVER:#{${DATABASE_URL} != null ? 'org.postgresql.Driver' : 'org.h2.Driver'}}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# Let Spring Boot auto-detect the database dialect based on the datasource
# PostgreSQL will be used when DATABASE_URL is present (Render), H2 for local dev
spring.jpa.database-platform=${DB_DIALECT:#{${DATABASE_URL} != null ? 'org.hibernate.dialect.PostgreSQLDialect' : 'org.hibernate.dialect.H2Dialect'}}

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Enable H2 Web Console to view database tables in browser (http://localhost:8080/h2-console)
# Disabled in production for security
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Server Configuration
server.port=${PORT:8080}
